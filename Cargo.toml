[package]
name = "moneytracker4"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[[bin]]
name = "moneytracker4"
path = "src/main.rs"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "85cd8c6b797f68d600f9f3c1cd3ce074e4415ddb" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "85cd8c6b797f68d600f9f3c1cd3ce074e4415ddb" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "85cd8c6b797f68d600f9f3c1cd3ce074e4415ddb" }
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = "0.4"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
